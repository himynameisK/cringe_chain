# Пример настроек cringe-chain.
#
# Скопировать в ~/.config/cringe-chain/config.toml и заполнить своими значениями.
# Все адреса ниже — из документационных диапазонов RFC 5737 и домена example.com,
# они заведомо никуда не ведут: заменить обязательно.
#
# Подробный разбор каждого поля — docs/configs.md.
#
# ВАЖНО: этот файл — единственное место с адресами и секретами. Сам config.toml
# в git не кладём (в репозитории лежит только этот пример с пустыми секретами).
#
# Пустые секреты ниже надо заполнить до первого `cringe apply`: пустое значение
# он не подставляет, а отказывается собирать конфиг — иначе sing-box принял бы
# пустой пароль и упал уже на живом соединении, без внятного текста.

[local]

# Куда класть сгенерированный конфиг sing-box. Файл перезаписывается каждым
# `cringe apply`, руками его править бессмысленно.
singbox_config = "~/.config/cringe-chain/sing-box.json"

# Лог sing-box. Сюда смотрит `cringe status`, когда процесс не поднялся.
singbox_log = "~/Library/Logs/cringe-chain/sing-box.log"

# Путь к brew. На Apple Silicon это /opt/homebrew/bin/brew, на Intel —
# /usr/local/bin/brew. Нужен явно: у запущенного из GUI процесса в PATH
# Homebrew обычно нет.
brew = "/opt/homebrew/bin/brew"

# Каталог, куда кладётся сгенерированный PAC-файл.
pac_dir = "~/.config/cringe-chain/pac"

# Адрес, который прописывается в системные настройки прокси. Должен указывать
# на PAC-файл из pac_dir. Именно http://, а не file:// — часть программ
# file-URL молча игнорирует.
pac_url = "http://127.0.0.1:8822/cringe.pac"

# Локальный HTTP-вход sing-box. Этот порт попадает в PAC и в HTTP_PROXY/HTTPS_PROXY.
entry_port = 7890

# Локальный SOCKS5-вход. Для программ, которые ходят через socks5h.
socks_port = 7891

# Уровень логирования sing-box: debug, info, warn, error.
log_level = "info"


[routing]

# Домены, которые должны идти через цепочку. Поддомены подхватываются по
# суффиксу — "example.com" покрывает и "api.example.com". Это ЕДИНСТВЕННЫЙ
# список: из него генерируются и правила sing-box, и PAC.
tunnel_domains = [
  "example.com",
  "example.org",
]

# Сети, которые тоже уходят в туннель — на случай, когда у сервиса нет домена
# или он резолвится в разное. Можно оставить пустым.
tunnel_cidrs = [
  "203.0.113.0/24",
]

# Домены, которые НЕ должны попадать в прокси: внутренние ресурсы, VPN
# организации, локальная сеть. Формат PAC — со звёздочкой.
bypass_domains = [
  "*.internal.example.com",
]

# То же самое для консольных программ (curl, git, npm). Формат переменной
# no_proxy — БЕЗ звёздочки, с ведущей точкой: запись со "*" curl и Node
# игнорируют целиком вместе со всем остальным списком.
no_proxy = [
  ".internal.example.com",
  "localhost",
  "127.0.0.1",
]


# Цепочка из двух звеньев. Порядок задаётся полем detour, а не порядком
# в файле: detour — имя ПРЕДЫДУЩЕГО звена. Последнее звено — то, на которое
# никто не ссылается; его адрес и увидит сайт.
#
# Здесь: мы -> hop1 -> exit -> сайт.

[[servers]]
# Произвольное короткое имя, по нему ссылаются в detour.
name = "hop1"
# Адрес сервера. Домен тоже годится.
host = "192.0.2.10"
# Порт, на котором слушает входящий inbound на сервере.
port = 8388
# shadowsocks или vless-reality.
protocol = "shadowsocks"
# Пусто — к этому звену подключаемся напрямую, это вход в цепочку.
detour = ""
# Шифр. Должен совпадать с серверным посимвольно, иначе соединение просто
# не устанавливается без внятной ошибки.
method = "2022-blake3-aes-128-gcm"
# СЕКРЕТ: пароль из конфига сервера. В git не коммитить.
password = ""

[[servers]]
name = "exit"
host = "198.51.100.25"
# Для reality почти всегда 443 — иначе маскировка под обычный сайт не работает.
port = 443
protocol = "vless-reality"
# Соединение к exit пойдёт через hop1.
detour = "hop1"
# СЕКРЕТ: тот же uuid, что у клиента на сервере (sing-box generate uuid).
uuid = ""
# СЕКРЕТ: публичная половина пары с сервера (sing-box generate reality-keypair).
# Приватная остаётся на сервере, сюда её класть не нужно.
public_key = ""
# СЕКРЕТ: один из short_id, перечисленных на сервере (openssl rand -hex 8).
short_id = ""
# Сайт прикрытия: под него маскируется рукопожатие. Нужен настоящий сайт
# с TLS 1.3 и HTTP/2, доступный С СЕРВЕРА, и тот же, что указан на сервере.
server_name = "example.com"
# Режим передачи vless. Должен совпадать с тем, что стоит у пользователя
# на сервере; обычная пара к reality — xtls-rprx-vision.
flow = "xtls-rprx-vision"
